# r6_koleo를 BERT로: r5d_bert(BERT, R5 조합) 위에 KoLeo 정규화 추가. 인과 확인 실험 -
# 평가 후처리(centering+PC 제거)가 사후에 하던 기하 배열을 학습 중 loss가 직접 하게
# 만들어 raw STS 상승 + raw-vs-후처리 격차 축소를 확인한다(성능 극대화 목적 아님).
# 예측 기준선은 r5d_bert_combined(BERT): STS-B dev ~0.611, eff_rank ~221
# (ModernBERT의 r5d 0.68~0.70과는 다른 스케일 - BERT 기준으로 재조정).
# a: koleo_lambda=0.05 (가장 약한 강도)
extends: r5d_bert.yaml

run_name: r6_bert_koleo_a

loss:
  koleo_lambda: 0.05
