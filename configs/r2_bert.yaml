# R2 설정(anchor+curriculum+K=3)을 bert-base-uncased 백본으로 (백본 비교용)
extends: base_bert.yaml

run_name: r2_bert_anchor_curriculum
seed: 42

augment:
  kind: flow_noise
  mode: anchor
  num_student_views: 3
  t_lo: 0.02
  t_start: 0.05
  t_max: 0.5
  warmup_frac: 0.4
  delta_t: 0.1
  time_embed: false

loss:
  teacher_temp: 0.082
  student_temp: 0.151
  center_momentum: 0.920
  velocity_head: false
  velocity_lambda: 0.05
