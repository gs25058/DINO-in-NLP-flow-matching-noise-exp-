# BERT: 안정화된 lr(3e-5)+warmup_frac(0.3) [LR sweep 결과] + centering만 uniform_push로 교체.
# 나머지(augment: 순수 curriculum, K=3)는 r2_bert_lr3e5_warmup30(순수 EMA)과 동일하게 맞춰
# centering 방식의 효과만 분리해서 본다.
extends: base_bert.yaml

run_name: r2_bert_uniform_push
seed: 42

train:
  lr: 3.0e-5
  warmup_frac: 0.3

augment:
  kind: flow_noise
  mode: anchor
  num_student_views: 3
  t_lo: 0.02
  t_start: 0.05
  t_max: 0.5
  warmup_frac: 0.4
  delta_t: 0.1
  time_embed: false

loss:
  teacher_temp: 0.082
  student_temp: 0.151
  center_momentum: 0.920
  velocity_head: false
  velocity_lambda: 0.05
  centering: uniform_push
  uniform_push_lr: 1.0
