# r10b: 1단계(align) + 노이즈 t 난이도 제어기.
#
# 1단계에서 확인된 것: lam 0.5든 0.1이든 pos_cos_raw가 결국 0.975로 수렴한다(궤적이 거의
# 겹침). 즉 압력 크기로는 포화를 못 막고, 난이도 자체를 유지해야 한다는 F2가 재현됐다.
#
# 명세 대비 두 가지 조정 (근거: 1단계 실측):
#  1) start_step=300 - pos_cos_raw가 U자(0.95 -> 0.54@100 -> 0.875@300 -> 0.975@1499)라
#     step 0부터 켜면 하강 구간을 "너무 어렵다"로 읽어 t를 하한 0.2까지 밀어버린다(어제
#     실측: 60 step 만에 0.225). 초반 약한 노이즈가 유해했다는 사실 4와도 충돌한다.
#     밴드 자체는 명세의 [0.85, 0.90]을 그대로 둔다 - step 300 시점 c_bar가 0.875로 밴드 안이다.
#  2) jitter 0.1 -> 0.075, t_init 0.5 -> 0.425 - 활성화 순간의 t 범위가 정확히 [0.35, 0.5]가
#     되어 r8/r10a와 연속이다. 명세값(t_init 0.5, jitter 0.1)이면 [0.4, 0.6]으로 점프해
#     "제어기 효과"와 "t 분포 변화"가 섞인다.
#
# lam은 1단계에서 피해가 적었던 0.1을 쓴다(0.5는 STS -0.034, alignment +0.053).
extends: r10a_bert_align_lam0.1_t50.yaml

run_name: r10b_bert_align_tctrl

t_ctrl:
  enabled: true
  start_step: 300
  band_lo: 0.85
  band_hi: 0.90
  step_size: 0.005
  jitter: 0.075
  t_min: 0.2
  t_max: 0.9
  t_init: 0.425
