# Teacher reads clean B inside a 5..7-sentence window (B tokens pooled);
# the student only ever sees noisy solo B, exactly like STS inference.
# Hyperparameters: context_distill combination 1 (A's search/confirmation best).
extends: ../context_distill/base.yaml
protocol: context_teacher
run_name: context_teacher
data:
  sentences_path: data/context_wikipedia_v2/train.jsonl
  rank_eval_path: data/context_wikipedia_v2/rank_eval_sentences.jsonl
  embed_stats_path: data/context_wikipedia_v2/embed_stats_bert_base_uncased.pt
  context_manifest_path: data/context_wikipedia_v2/manifest.json
  context_heldout_path: data/context_wikipedia_v2/heldout.jsonl
train:
  lr: 5.241414814292829e-05
  head_lr: 0.0003238272196810765
context:
  mode: none
  teacher_mode: none
  weak_t_max: 0.04890810138516455
  beta: 0.5085607358822072
  side_budget: 160
  total_budget: 450
loss:
  view_weights: [1.0, 1.0, 0.5085607358822072]
