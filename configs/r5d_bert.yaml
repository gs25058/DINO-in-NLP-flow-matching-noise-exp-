# BERT용 R5d 결합: 안정화된 lr(3e-5)+warmup_frac(0.3) + r5c(고정 t~U(0.35,0.5))
# + r5a(teacher_temp 스케줄) + r5b(momentum ramp) 전부 한 번에 적용.
# backbone-bert-base 브랜치 configs/r5d_bert.yaml을 이 브랜치(centering-uniform-push)로 포팅.
# (해당 브랜치의 log_grad_norm 진단 플래그는 이 브랜치 train.py에 없어 제외.)
extends: base_bert.yaml

run_name: r5d_bert_combined
seed: 42

train:
  lr: 3.0e-5
  warmup_frac: 0.3
  teacher_momentum: 0.997
  momentum_start: 0.997
  momentum_end: 0.9995

augment:
  kind: flow_noise
  mode: anchor
  num_student_views: 3
  t_lo: 0.35
  t_start: 0.5
  t_max: 0.5
  warmup_frac: 0.0
  delta_t: 0.1
  time_embed: false

loss:
  warmup_teacher_temp: 0.082
  teacher_temp: 0.11
  teacher_temp_warmup_frac: 0.3
  student_temp: 0.151
  center_momentum: 0.920
  velocity_head: false
  velocity_lambda: 0.05
