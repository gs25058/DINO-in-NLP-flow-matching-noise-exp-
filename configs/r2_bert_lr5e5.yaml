# BERT LR sweep: lr=5e-5
extends: base_bert.yaml

run_name: r2_bert_lr5e5
seed: 42

train:
  lr: 5.0e-5
  log_grad_norm: true

augment:
  kind: flow_noise
  mode: anchor
  num_student_views: 3
  t_lo: 0.02
  t_start: 0.05
  t_max: 0.5
  warmup_frac: 0.4
  delta_t: 0.1
  time_embed: false

loss:
  teacher_temp: 0.082
  student_temp: 0.151
  center_momentum: 0.920
  velocity_head: false
  velocity_lambda: 0.05
