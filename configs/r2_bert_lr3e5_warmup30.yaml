# BERT LR sweep 3개(1e-4/5e-5/3e-5) 전부 "성공" 기준(step1500 STS-B dev > baseline) 미달
# (붕괴는 없었음, eff_rank 두 자릿수 유지). 가장 안정적이었던 lr=3e-5에 warmup_frac만 0.1->0.3 연장.
extends: base_bert.yaml

run_name: r2_bert_lr3e5_warmup30
seed: 42

train:
  lr: 3.0e-5
  warmup_frac: 0.3
  log_grad_norm: true

augment:
  kind: flow_noise
  mode: anchor
  num_student_views: 3
  t_lo: 0.02
  t_start: 0.05
  t_max: 0.5
  warmup_frac: 0.4
  delta_t: 0.1
  time_embed: false

loss:
  teacher_temp: 0.082
  student_temp: 0.151
  center_momentum: 0.920
  velocity_head: false
  velocity_lambda: 0.05
