# r5d_bert(R5 스케줄 결합) 위에, 기존 로짓(8192-dim, DINO head 이후) uniform_push 대신
# teacher의 mean-pooled 임베딩(BERT 통과 직후, DINO head 이전, hidden_size=768차원)에
# 직접 uniformity push를 가하는 실험 변형 (팀원 요청, 임시 비교 실행).
# loss.centering은 명시하지 않아 기본값 "ema"(순수 EMA centering, logit-space push 없음) -
# push는 오직 embed_push_lr을 통한 embedding-space 메커니즘(src/loss.py EmbedUniformPush)뿐.
extends: r5d_bert.yaml

run_name: r5d_bert_embed_uniform_push

loss:
  embed_push_lr: 0.1
