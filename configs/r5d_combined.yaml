# R5d: r5c(고정 t 구간, curriculum 없음) + r5a(teacher_temp 스케줄) + r5b(momentum ramp) 결합.
extends: base.yaml

run_name: r5d_combined
seed: 42

train:
  teacher_momentum: 0.997
  momentum_start: 0.997
  momentum_end: 0.9995

augment:
  kind: flow_noise
  mode: anchor
  num_student_views: 3
  t_lo: 0.35
  t_start: 0.5
  t_max: 0.5
  warmup_frac: 0.0
  delta_t: 0.1
  time_embed: false

loss:
  warmup_teacher_temp: 0.082
  teacher_temp: 0.11
  teacher_temp_warmup_frac: 0.3
  student_temp: 0.151
  center_momentum: 0.920
  velocity_head: false
  velocity_lambda: 0.05
