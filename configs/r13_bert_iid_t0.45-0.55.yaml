# R13-B 대조군 1: iid 노이즈만 강화 U(0.45, 0.55). pooled 0.9118 - rho0.5(0.9138)와 짝.
# 구조는 그대로 두고 난이도만 맞췄다. 이 arm이 rho0.5만큼 개선되면 원인은 구조가 아니라
# 난이도였다는 뜻이다(P-V3).
# B0 실측(scripts/measure_view_hardness.py, r12_t35_s42, 512문장) - pooled / 토큰 코사인:
#   r8 기준 U(0.35,0.50)  0.9429 / 0.8374
#   iid  U(0.45,0.55)     0.9118 / 0.7709      rho=0.5     0.9138 / 0.8407   <- 쌍 1
#   iid  U(0.50,0.60)     0.8744 / 0.7202      rho=1.0     0.8808 / 0.8406   <- 쌍 2
#                                              cutoff 0.1  0.8894 / 0.8373   <- 쌍 2
# 같은 pooled 난이도를 만드는 데 iid는 토큰을 44~72% 더 망가뜨려야 한다. 이 매트릭스는
# pooled 난이도를 맞춘 쌍으로 구성해 "구조 때문인가 난이도 때문인가"(P-V3)를 직접 가른다.
