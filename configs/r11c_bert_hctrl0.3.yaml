# R11-A 폐루프: H(p_t)를 anchor -> anchor-0.3 nats로 끌어내린다.
# 설계 좌표를 tau_t가 아니라 H_pt로 잡는 이유 - 학습이 진행되면 logit 스케일이 자라므로
# 같은 tau_t가 같은 유효 날카로움을 뜻하지 않는다. 개루프와 같은 H 도달점에서 결과가 다르면
# 경로(속도) 의존성이 있다는 뜻이다.
extends: r8_bert_coviso_sched_optuna_t50.yaml
run_name: r11c_bert_hctrl0.3
loss:
  entropy_ctrl: true
  entropy_ctrl_start_frac: 0.45
  entropy_ctrl_end_frac: 0.85
  entropy_ctrl_delta: 0.3
  entropy_ctrl_gain: 0.02
  entropy_ctrl_tau_min: 0.05
  entropy_ctrl_max_step: 0.01
collapse_guard:
  enabled: true
  h_p_bar_t_ref: 9.0097     # r8 plateau(step 675~1499, 2시드) 실측
  eff_rank_ref: 305.16
  batch_kl_ref: 0.0620
