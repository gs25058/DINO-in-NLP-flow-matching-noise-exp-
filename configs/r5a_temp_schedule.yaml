# R5a: R2(anchor+curriculum+K=3) + teacher_temp warmup 스케줄만 추가 (DINO 원본 방식).
extends: base.yaml

run_name: r5a_temp_schedule
seed: 42

augment:
  kind: flow_noise
  mode: anchor
  num_student_views: 3
  t_lo: 0.02
  t_start: 0.05
  t_max: 0.5
  warmup_frac: 0.4
  delta_t: 0.1
  time_embed: false

loss:
  warmup_teacher_temp: 0.082
  teacher_temp: 0.11              # 0.082 -> 0.11로 선형 증가 (R2는 0.082 고정)
  teacher_temp_warmup_frac: 0.3
  student_temp: 0.151
  center_momentum: 0.920
  velocity_head: false
  velocity_lambda: 0.05
