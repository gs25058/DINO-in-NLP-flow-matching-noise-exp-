# r5d_bert(R5 스케줄 결합: teacher_temp warmup + momentum ramp, BERT lr/warmup 안정화)
# 위에 uniform_push centering(Optuna 튜닝된 파라미터, tune_bert_uniform_push_wide
# best trial)을 얹은 조합. 목적: uniform_push가 R5의 collapse 해결과 누적 효과가
# 있는지, 아니면 겹치는(redundant) 효과인지 확인.
#
# teacher_temp: r5d의 스케줄 종착값(0.11)을 Optuna가 찾은 튜닝값(0.1393)으로 교체.
# (warmup_teacher_temp=0.082, teacher_temp_warmup_frac=0.3은 r5d 그대로 유지)
# center_momentum: r5d 기본값(0.920) 대신 튜닝값(0.9887).
extends: r5d_bert.yaml

run_name: r5d_bert_uniform_push_tuned

loss:
  teacher_temp: 0.1393
  center_momentum: 0.9887
  centering: uniform_push
  uniform_push_lr: 4.083
