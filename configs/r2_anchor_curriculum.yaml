# R2: anchor 모드 + curriculum + K=3 (본 제안 기본형, METHOD.md §6)
# 다른 run은 이 파일을 복사해 augment/loss 블록만 바꾼다. 코드 분기 금지.
extends: base.yaml

run_name: r2_anchor_curriculum
seed: 42            # 시드 2개 이상: 42, 43

augment:
  kind: flow_noise
  mode: anchor        # anchor | consistency
  num_student_views: 3
  t_lo: 0.02
  t_start: 0.05
  t_max: 0.5
  warmup_frac: 0.4    # t_hi curriculum: 전체 step의 40%까지 선형 증가
  delta_t: 0.1        # anchor 모드에서는 미사용
  time_embed: false

loss:
  teacher_temp: 0.082
  student_temp: 0.151
  center_momentum: 0.920
  velocity_head: false
  velocity_lambda: 0.05
