# Exact resolved upstream R18 iBOT-off control, before experiment instrumentation.
model:
  backbone: bert-base-uncased
  pooling: mean
  head:
    logit_dim: 8192
    bottleneck_dim: 256
train:
  batch_size: 32
  max_steps: 4000
  optimizer: adamw
  lr: 6.876495483323049e-05
  weight_decay: 0.226
  scheduler: warmup_cosine
  warmup_frac: 0.0517088539939031
  teacher_momentum: 0.997
  momentum_start: 0.997
  momentum_end: 0.9985014352751024
  head_lr: 0.0005824833585133
  exclude_ln_bias_wd: true
  grad_clip: 5.590297628724676
  momentum_ramp_frac: 0.4077115063691495
  momentum_shape: cosine
  data_order: epoch
data:
  sentences_path: data/sentences.jsonl
  rank_eval_path: data/rank_eval_sentences.jsonl
  embed_stats_path: data/embed_stats_bert_base_uncased.pt
  max_tokens: 128
eval:
  every_steps: 250
  log_every_steps: 10
  batch_kl_pairs: 256
logging:
  backend: wandb
  wandb_mode: offline
run_name: r18_bert_ctrl
seed: 42
augment:
  kind: flow_noise
  mode: anchor
  num_student_views: 3
  t_lo: 0.3919166650119331
  t_start: 0.4638073616095715
  t_max: 0.8811226221985871
  warmup_frac: 0.02545633588184152
  delta_t: 0.1
  time_embed: false
  token_latent_views: 1
  mask_ratio: 0.15
  mask_then_noise: true
loss:
  warmup_teacher_temp: 0.0494051972253961
  teacher_temp: 0.1347501197840043
  teacher_temp_warmup_frac: 0.0789677221858058
  student_temp: 0.151
  center_momentum: 0.92
  velocity_head: false
  velocity_lambda: 0.05
  cov_iso_lambda: 5.874093568592943
  cov_ema_momentum: 0.8195105695006707
  cov_iso_start_step: 56
  teacher_temp_shape: cosine
  ibot_head: shared
  ibot_use_token_center: true
collapse_guard:
  enabled: false
  h_p_bar_t_ref: 9.0093
  eff_rank_ref: 318.99
  batch_kl_ref: 0.045
  start_frac: 0.2
  patience: 3
