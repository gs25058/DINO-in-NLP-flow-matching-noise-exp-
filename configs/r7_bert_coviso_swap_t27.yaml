# R7 확인 run: BERT 최고점 라인(r6_bert_koleo_lrsplit_optuna_best_t27, Optuna 튜닝된
# lr/head_lr/grad_clip 그대로)에서 KoLeo(쌍별 반발, koleo_lambda=0.4227)만 cov_iso(분포
# 통계량 제약)로 교체. λ는 ModernBERT 캘리브레이션에서 확정된 값(2.0)을 그대로 전이 -
# BERT 전용 재캘리브레이션은 하지 않음(범위 밖, 필요 시 후속 과제).
extends: r6_bert_koleo_lrsplit_optuna_best_t27.yaml

run_name: r7_bert_coviso_swap_t27

loss:
  koleo_lambda: 0.0
  cov_iso_lambda: 2.0
  cov_ema_momentum: 0.99
  cov_iso_start_step: 50
